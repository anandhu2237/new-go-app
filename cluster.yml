apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: demo-cluster
  region: us-east-1
  version: "1.36"

vpc:
  nat:
    gateway: Disable        # no NAT gateway (saves ~$1/day)

managedNodeGroups:
  - name: standard-workers
    instanceType: t3.small  # free-tier eligible and cheap
    desiredCapacity: 1
    minSize: 1
    maxSize: 2
    volumeSize: 20          # 20 GB instead of 80 GB
    volumeType: gp3
    privateNetworking: false  # nodes use public subnets, so no NAT is needed